<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Workshop &amp; Networking Event · Vernon Tech &amp; Media</title>
  <meta name="description" content="Register for tonight's AI workshop and networking event in Katy. Check in for the Wi-Fi, tools, and resources." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d1016;--panel:#161b23;--panel2:#1c222c;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);--text:#eef1f5;--muted:#98a2b0;--gold:#e9b84c;--gold2:#f2cf74;--blue:#4f8cff;--ok:#38d18a;--fdisp:'Plus Jakarta Sans',system-ui,sans-serif;--fbody:'DM Sans',system-ui,sans-serif;--fmono:'JetBrains Mono',ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(1200px 600px at 50% -10%,#1a2130,#0d1016 60%);color:var(--text);font-family:var(--fbody);-webkit-font-smoothing:antialiased;min-height:100vh}
    button,input{font-family:inherit}
    a{color:var(--gold);text-decoration:none}
    .wrap{max-width:680px;margin:0 auto;padding:40px 20px 90px}
    .brand{text-align:center;font-family:var(--fdisp);font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--muted);margin-bottom:26px}
    .brand b{color:var(--text)}
    .hero{text-align:center;margin-bottom:28px}
    .kicker{display:inline-block;font-family:var(--fdisp);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#0d1016;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:6px 14px;border-radius:999px;margin-bottom:16px}
    h1{font-family:var(--fdisp);font-weight:800;font-size:34px;line-height:1.08;letter-spacing:-.01em}
    h1 .g{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .sub{color:var(--muted);font-size:16px;margin-top:12px;line-height:1.5}
    .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
    .chip{font-size:12.5px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:500}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 24px 60px -24px rgba(0,0,0,.6)}
    .fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 7px}
    .fl:first-child{margin-top:0}
    .inp{width:100%;background:var(--panel2);border:1.5px solid var(--line2);border-radius:12px;padding:14px 15px;font-size:16px;color:var(--text)}
    .inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,184,76,.16)}
    .inp::placeholder{color:#67707c}
    .btn{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d1016;border:none;border-radius:12px;padding:16px;font-family:var(--fdisp);font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 26px -10px rgba(233,184,76,.6)}
    .btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.55;cursor:default;filter:none}
    .err{color:#ff8080;font-size:13.5px;margin-top:12px;min-height:1px}
    .fine{color:var(--muted);font-size:12px;text-align:center;margin-top:14px;line-height:1.5}
    /* after check-in */
    .rez-h{text-align:center;margin-bottom:22px}
    .rez-h .ok{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;font-size:14px;margin-bottom:8px}
    .sec-label{font-family:var(--fdisp);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}
    .rez{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
    .rez-t{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .rez-t .ico{width:22px;height:22px;flex-shrink:0;color:var(--gold)}
    .rez-t h3{font-family:var(--fdisp);font-weight:700;font-size:16px;color:var(--text);flex:1}
    .kv{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
    .kv .k{font-size:12px;color:var(--muted);font-weight:600}
    .kv .v{font-family:var(--fmono);font-size:15px;color:var(--text);flex:1;text-align:right;margin-right:8px;word-break:break-all}
    .copy{background:var(--panel2);border:1px solid var(--line2);color:var(--text);font-size:11.5px;font-weight:600;border-radius:8px;padding:6px 11px;cursor:pointer;flex-shrink:0}
    .copy:hover{border-color:var(--gold);color:var(--gold)}
    .dl{display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0d1016;border-radius:12px;padding:15px 16px;font-family:var(--fdisp);font-weight:800;font-size:15px;width:100%;border:none;cursor:pointer}
    .dl .ico{width:20px;height:20px}
    .dl.gray{background:var(--panel2);color:#5c6572;cursor:not-allowed;border:1px solid var(--line);box-shadow:none}
    .dl-note{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
    .state{text-align:center;padding:70px 20px;color:var(--muted)}
    /* TV screen / QR mode */
    body.screen{display:flex;align-items:center;justify-content:center}
    .screen-wrap{text-align:center;padding:30px}
    .screen-wrap .kicker{font-size:15px;padding:8px 20px}
    .screen-wrap h1{font-size:clamp(36px,6vw,74px);margin:18px 0 10px}
    .screen-wrap .sub{font-size:clamp(16px,2.4vw,26px)}
    .qrbox{background:#fff;border-radius:24px;padding:26px;display:inline-block;margin:34px 0 18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
    .qrbox img,.qrbox canvas{display:block;width:min(46vh,380px);height:min(46vh,380px)}
    .scan{font-family:var(--fdisp);font-weight:800;font-size:clamp(18px,2.6vw,30px);color:var(--gold)}
    .scan .u{color:var(--muted);font-weight:600;font-size:.7em;display:block;margin-top:6px}
  </style>
</head>
<body>
  <div id="app"><div class="state">Loading…</div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    var SLUG='katy-ai-meetup', EVENT_NAME='Katy AI Workshop & Networking Event';
    var WIFI_NET='TMOBILE-EEFC', WIFI_PASS='y7392gycuyu';
    var SCALESOLO_URL='https://scalesolo.ai/?ref=onlylocals';
    var HAS_RESOURCES=false; // flip to true when tonight's event has resources
    var app=document.getElementById('app');
    var params=new URLSearchParams(location.search);
    var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
    var baseUrl=location.origin+'/ai-meetup';

    // ── TV / QR screen mode ──
    if(params.get('screen')==='1'||params.get('qr')==='1'){
      document.body.classList.add('screen');
      app.innerHTML=''
        +'<div class="screen-wrap"><div class="kicker">Tonight · Katy, TX</div>'
        +'<h1>AI Workshop <span class="g">&amp; Networking</span></h1>'
        +'<div class="sub">Scan to register and check in.</div>'
        +'<div class="qrbox"><div id="qr"></div></div>'
        +'<div class="scan">vernontm.com/ai-meetup<span class="u">Point your camera at the code</span></div></div>';
      try{ new QRCode(document.getElementById('qr'),{text:baseUrl,width:380,height:380,colorDark:'#0d1016',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
    } else {
      boot();
    }

    function boot(){
      if(params.get('preview')==='1'||params.get('resources')==='1'){ showCheckedIn(); return; }
      if(localStorage.getItem('vtm_meetup_reg')==='1'){ showCheckedIn(); }
      else { showForm(); }
    }

    function showForm(){
      app.innerHTML=''
        +'<div class="wrap">'
        +'<div class="brand"><b>VERNON TECH &amp; MEDIA</b> · KATY</div>'
        +'<div class="hero"><div class="kicker">Tonight</div>'
        +'<h1>Register for Tonight\'s <span class="g">AI Workshop</span> &amp; Networking Event</h1>'
        +'<div class="sub">Check in below and we\'ll get you connected: Wi-Fi, tools, and everything from tonight.</div>'
        +'<div class="meta"><span class="chip">📍 Katy, TX</span><span class="chip">🤖 AI Workshop</span><span class="chip">🤝 Networking</span></div></div>'
        +'<div class="card">'
        +'<label class="fl">Full name</label><input class="inp" id="name" placeholder="Your name" autocomplete="name" />'
        +'<label class="fl">Email</label><input class="inp" id="email" type="email" placeholder="you@email.com" autocomplete="email" />'
        +'<label class="fl">Phone</label><input class="inp" id="phone" type="tel" placeholder="(555) 555-5555" autocomplete="tel" />'
        +'<button class="btn" id="go">Check in</button>'
        +'<div class="err" id="err"></div>'
        +'<div class="fine">We\'ll only use this to share event resources and occasional updates. No spam.</div>'
        +'</div></div>';
      var go=document.getElementById('go');
      ['name','email','phone'].forEach(function(id){ document.getElementById(id).addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); }); });
      go.onclick=submit;
    }

    async function submit(){
      var err=document.getElementById('err'); err.textContent='';
      var name=document.getElementById('name').value.trim();
      var email=document.getElementById('email').value.trim();
      var phone=document.getElementById('phone').value.trim();
      if(!name){err.textContent='Please add your name.';return;}
      if(!email||email.indexOf('@')<0){err.textContent='Please add a valid email.';return;}
      if(phone.replace(/\D/g,'').length<7){err.textContent='Please add a valid phone number.';return;}
      var go=document.getElementById('go'); go.disabled=true; go.textContent='Checking you in…';
      try{
        var r=await fetch('/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({stage:'checkin',name:name,email:email,phone:phone,event:EVENT_NAME,source:'katy-ai-meetup'})});
        if(!r.ok) throw new Error();
        localStorage.setItem('vtm_meetup_reg','1');
        localStorage.setItem('vtm_meetup_name',name);
        showCheckedIn();
      }catch(e){ go.disabled=false; go.textContent='Check in'; err.textContent='Something went wrong. Please try again.'; }
    }

    function showCheckedIn(){
      var first=(localStorage.getItem('vtm_meetup_name')||'').split(' ')[0];
      var WIFI='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>';
      var ROCKET='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>';
      var FOLDER='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
      app.innerHTML='<div class="wrap"><div class="brand"><b>VERNON TECH &amp; MEDIA</b> · KATY</div>'
        +'<div class="rez-h"><div class="ok">✓ You\'re checked in'+(first?', '+esc(first):'')+'</div>'
        +'<h1 style="font-size:26px">Welcome to Tonight\'s Event</h1>'
        +'<div class="sub" style="font-size:14.5px">Here\'s everything you need to get connected.</div></div>'

        +'<div class="sec-label">Get connected</div>'
        +'<div class="rez"><div class="rez-t">'+WIFI+'<h3>Wi-Fi</h3></div>'
        +'<div class="kv"><span class="k">Network</span><span class="v">'+esc(WIFI_NET)+'</span><button class="copy" data-copy="'+esc(WIFI_NET)+'">Copy</button></div>'
        +'<div class="kv"><span class="k">Password</span><span class="v">'+esc(WIFI_PASS)+'</span><button class="copy" data-copy="'+esc(WIFI_PASS)+'">Copy</button></div>'
        +'</div>'

        +'<div class="rez"><div class="rez-t">'+ROCKET+'<h3>ScaleSolo · $1 Trial</h3></div>'
        +'<div class="sub" style="font-size:13.5px;margin:0 0 12px;text-align:left">The AI social media manager we use. Try everything for $1.</div>'
        +'<a class="dl" href="'+esc(SCALESOLO_URL)+'" target="_blank" rel="noopener">Start the $1 trial</a>'
        +'</div>'

        +'<div class="rez"><div class="rez-t">'+FOLDER+'<h3>Event Resources</h3></div>'
        +(HAS_RESOURCES
          ? '<button class="dl" id="rezbtn">Open event resources</button>'
          : '<button class="dl gray" disabled>Event resources</button><div class="dl-note">No resources for tonight\'s event. They\'ll show up here when a session includes them.</div>')
        +'</div>'
        +'</div>';
      app.querySelectorAll('[data-copy]').forEach(function(b){ b.onclick=function(){
        navigator.clipboard.writeText(b.dataset.copy).then(function(){ var o=b.textContent; b.textContent='Copied ✓'; setTimeout(function(){b.textContent=o;},1500); });
      };});
    }
  </script>
</body>
</html>
